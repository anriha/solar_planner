[package]
name = "solar_controller"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
kameo = "0.22.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-modbus = "0.17.0"
tokio-serial = "5.5.0"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
