# Deye SUN-12K-SG05LP3-EU-SM2 (3-phase LV hybrid) register map.
# The single contract artifact: the Rust bridge parses/serves it, the HA
# integration builds entities from the JSON meta it receives over the WS.
# Unknown fields are rejected at load (deny_unknown_fields) - a typo is a
# startup failure, not a silent default.
#
# Sources: Developer089/deye-modbus-ha sun_3ph_hybrid.yaml (derived from
# Deye's official 3-phase protocol doc), cross-checked against
# kellerza/sunsynk three_phase_common.py / three_phase_lv.py.
# Entries marked VERIFIED were value-checked on this hardware 2026-09-27/28
# (mbpoll captures, plan.md "Verified on hardware").
#
# Decoding contract:
#   value = (raw - offset) * scale        # temperatures: offset 1000, scale 0.1
#   s16/s32: two's complement             # grid/battery power & current
#   32-bit: base_word = which 16-bit word sits at the sensor's own address.
#     VERIFIED LOW on hardware 2026-09-27, twice: (20,21)=(0xD4C0,0x0001)
#     -> 0x0001D4C0 = 120000 -> 12000.0 W rated power; (534,535)=(0x022E,
#     0x0000) -> 558 -> 55.8 kWh PV total. Matches Developer089 low_high
#     and sunsynk.
#   options present -> raw is an enum index, decoded to the mapped string
#   str: N words, 2 ASCII chars per word, high byte first, NULs trimmed
#
# Sign conventions to verify under real load (plan open items):
#   grid_power_total 619: import = positive (per Developer089, unverified)
#   battery 590/591: sunsynk applies negative scale (native flip? unverified)
#
# TODO firmware version registers: probed 2026-09-27 - candidate block
# 542-547 reads ~zeros, NOT versions. Best candidate is reg 22 = 0x0203
# (plausible "V2.03") - compare against LCD version screen and add.

